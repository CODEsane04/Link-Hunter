<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Hunter</title>
    <link rel="stylesheet" href="vps.css"> 
</head>
<body>

    <!-- Untouched Header -->
    <div class="logo" id="logo">
        <img src="https://placehold.co/30x30/10B981/FFFFFF?text=LH" alt="">
        <h3>LINK HUNTER</h3>
    </div>

    <!-- Revamped Product Info -->
    <div class="product" id="product">
        <h2 class="section-title">Search Query</h2>
        <h3 class="prod-name" id="prod-name">Loading...</h3>
    </div>

    <!-- Revamped List Container -->
    <div class="link-list-container">
        <div class="list-header-row">
            <span class="header-title">Tutorials</span>
            <span class="header-score">Score</span>
        </div>
        
        <div class="link-list" id="link-list">
            <!-- Dynamic data gets appended here by JS -->
        </div>
    </div>

    <footer>
        <p>© 2026 Link Hunter. All rights reserved.</p>
    </footer>

    <script src="./vps.js"></script>
</body>
</html>
